<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniDB</title><style>
:root{font:16px system-ui;color:#dce7f5;background:#101827}*{box-sizing:border-box}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:36px;margin:0}p,small{color:#9cafc8}section{background:#192438;border:1px solid #30405a;border-radius:12px;padding:20px;margin-top:20px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit;border-radius:6px;border:1px solid #425572;background:#101827;color:#dce7f5;padding:10px}button{cursor:pointer;background:#284e81}button:hover{background:#35669f}textarea{width:100%;font:14px ui-monospace,monospace;resize:vertical}label{display:block;margin:12px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;min-width:100%;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #30405a;max-width:320px;overflow-wrap:anywhere}th{color:#88baff}.scroll{overflow:auto;max-height:420px}#status{color:#9bceae}.error{color:#ffaaa5!important}input{max-width:100%}
</style></head><body><main><h1>MiniDB</h1><p>A Python document database. Create tables, browse records, and run JSON commands.</p>
<section><div class="bar"><label for="token">API token (if configured)</label><input type="password" id="token" autocomplete="off"><button id="connect">Connect / refresh</button></div></section>
<section><div class="bar"><select id="tables" aria-label="Select table"></select><button id="browse">Browse</button><input id="name" placeholder="New table name" aria-label="New table name"><button id="create">Create table</button></div><p id="count">No table selected.</p><div class="scroll"><table id="records"></table></div><div class="bar" style="margin-top:12px"><button id="previous">Previous page</button><button id="next">Next page</button></div></section>
<section><h2>Command editor</h2><div class="bar"><button data-op="insert">Insert</button><button data-op="select">Filter</button><button data-op="update">Update</button><button data-op="delete">Delete</button><button data-op="drop">Drop table</button></div><label for="command">JSON command</label><textarea id="command" rows="7">{"op":"tables"}</textarea><p><small>Filters match exact field values. Records have an automatically generated _id.</small></p><button id="execute">Execute command</button><p id="status" role="status" aria-live="polite"></p><pre id="result"></pre></section></main><script>
const el=id=>document.getElementById(id);let offset=0,total=0;
async function api(command){const response=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+el('token').value},body:JSON.stringify(command)});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result;}
async function safe(action){try{await action();el('status').textContent='Ready.';el('status').className='';}catch(error){el('status').textContent=error.message;el('status').className='error';}}
async function refresh(){const data=await api({op:'tables'}),selected=el('tables').value;el('tables').replaceChildren();for(const table of data.tables){const option=document.createElement('option');option.value=table.name;option.textContent=`${table.name} (${table.count})`;el('tables').append(option);}if(data.tables.some(t=>t.name===selected))el('tables').value=selected;await browse();}
async function browse(){const name=el('tables').value;el('records').replaceChildren();if(!name){total=0;el('count').textContent='Create a table to get started.';el('previous').disabled=true;el('next').disabled=true;return;}const data=await api({op:'select',table:name,limit:100,offset});total=data.total;el('count').textContent=`${name}: ${total} records · showing ${data.rows.length?offset+1:0}–${offset+data.rows.length}`;const columns=['_id',...new Set(data.rows.flatMap(row=>Object.keys(row).filter(k=>k!=='_id')))];const head=document.createElement('tr');for(const key of columns){const cell=document.createElement('th');cell.textContent=key;head.append(cell);}el('records').append(head);for(const row of data.rows){const tr=document.createElement('tr');for(const key of columns){const td=document.createElement('td');td.textContent=Object.prototype.hasOwnProperty.call(row,key)?JSON.stringify(row[key]):'';tr.append(td);}el('records').append(tr);}el('previous').disabled=offset===0;el('next').disabled=offset+100>=total;}
el('connect').onclick=()=>safe(async()=>{offset=0;await refresh();});el('browse').onclick=()=>safe(browse);el('tables').onchange=()=>safe(async()=>{offset=0;await browse();});
el('create').onclick=()=>safe(async()=>{const name=el('name').value.trim();await api({op:'create',table:name});offset=0;await refresh();el('tables').value=name;await browse();el('name').value='';});
el('previous').onclick=()=>safe(async()=>{offset=Math.max(0,offset-100);await browse();});el('next').onclick=()=>safe(async()=>{offset+=100;await browse();});
for(const button of document.querySelectorAll('[data-op]'))button.onclick=()=>{const op=button.dataset.op,command={op,table:el('tables').value||'people'};if(op==='insert')command.values={name:'Ada',age:36};if(op==='select')command.where={name:'Ada'};if(op==='update'){command.where={_id:1};command.values={age:37};}if(op==='delete')command.where={_id:1};el('command').value=JSON.stringify(command,null,2);el('command').focus();};
el('execute').onclick=()=>safe(async()=>{const command=JSON.parse(el('command').value);if(['delete','drop'].includes(command?.op)&&!confirm('Execute this destructive command?'))return;const result=await api(command);el('result').textContent=JSON.stringify(result,null,2);offset=0;await refresh();});safe(refresh);
</script></body></html>
