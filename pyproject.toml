[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "minidb-python"
version = "1.0.0"
description = "A Python document database with desktop and web interfaces"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
minidb = "minidb.__main__:main"
[tool.setuptools.packages.find]
include = ["minidb*"]
[tool.setuptools.package-data]
minidb = ["static/*.html"]
